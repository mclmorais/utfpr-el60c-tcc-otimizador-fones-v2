name: Formatação

on:
  pull_request:
  push:
    branches: [main]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install clang-format==23.1.3
      - run: python tools/lint.py check
